name: Verify, build, and submit iOS

on:
  push:
    branches: ['main']
  workflow_dispatch: {}

concurrency:
  group: ios-production-${{ github.ref }}
  cancel_in_progress: true

jobs:
  verify:
    name: Test, typecheck, and diagnose
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run tests
        run: npm test
      - name: Run type checks
        run: npm run typecheck
      - name: Run Expo Doctor
        run: npm run doctor

  build_ios:
    name: Build iOS for TestFlight
    needs: [verify]
    type: build
    params:
      platform: ios
      profile: ios-production

  submit_testflight:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: ios-production
